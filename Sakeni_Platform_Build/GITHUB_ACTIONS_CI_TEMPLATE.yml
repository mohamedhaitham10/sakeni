name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  admin:
    name: Admin Next.js checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sakeni_Platform_Build/Phase_3_AdminDashboard/admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Sakeni_Platform_Build/Phase_3_AdminDashboard/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Run launch checks
        run: npm run check
